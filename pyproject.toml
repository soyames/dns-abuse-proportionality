[project]
name = "dns-abuse-proportionality"
version = "0.3.0"
description = "Observational research pipeline for DNS-abuse feed data, RDAP metadata and candidate triage labels."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Yao Amevi A. Sossou", email = "47247401+soyames@users.noreply.github.com" }
]
requires-python = ">=3.11"
# Exact pins, kept identical to requirements.txt (which the Docker image installs).
# tldextract also fixes the bundled Public Suffix List, so changing it can change parsed domains.
dependencies = [
    "aiohttp==3.10.11",
    "asyncpg==0.30.0",
    "python-dateutil==2.9.0.post0",
    "tldextract==5.1.2",
]

[dependency-groups]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false
default-groups = ["notebook"]
